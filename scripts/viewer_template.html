<title>Palomares Corridor Viewer</title>

  #info { color:var(--muted); font-variant-numeric:tabular-nums; }
  #legend { position:fixed; right:12px; bottom:12px; background:var(--panel); padding:8px 10px; border-radius:8px; font-size:12px; }
  #legend span { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; vertical-align:middle; }
  .hide-ui #ui, .hide-ui #legend { display:none; }
</style>

  <div class="row" style="color:var(--muted)">S = SR-84 / Niles Canyon end. Markers every 500 m. Drag to orbit, scroll to zoom.</div>
</div>

  <div><span style="background:#ff3b30"></span>steep face / wall (cut)</div>

const OV = new THREE.Group(); scene.add(OV);
const idxAt = s => Math.max(0, Math.min(N-1, Math.round(s/2)));
const fcol = {steep_face:0xff3b30, steep_drop:0xff9f0a, guardrail_candidate:0xc7ccd1, lidar_gap:0xd63cf0, lidar_sparse:0xb070c0,
  bridge_osm:0x33c6ff, bridge_lidar_class17:0x33c6ff, stream_crossing:0x33c6ff, junction:0xffd60a, driveway:0xffd60a, sign:0xff2d55, summit:0xffffff};
for (const f of FEATS){
  const c = fcol[f.k]; if (c===undefined) continue;

  x.fillStyle='rgba(15,20,24,.85)'; x.fillRect(0,0,256,96); x.fillStyle='#f2c14e'; x.font='bold 56px system-ui'; x.textAlign='center'; x.textBaseline='middle'; x.fillText(txt,128,50);

  const post=new THREE.Mesh(new THREE.BoxGeometry(0.25,2.5,0.25), new THREE.MeshBasicMaterial({color:0xf2c14e})); post.position.copy(W(p[0],p[1],p[2]+1.25)); OV.add(post);

const sl=document.getElementById('sl'); sl.max=Math.floor(META.length);
function placeOrbit(s){ const i=idxAt(s); const p=W(R.x[i],R.y[i],R.z[i]); controls.target.copy(p); cam.position.copy(p).add(new THREE.Vector3(70,95,90)); controls.update(); }
function driver(s, back=false){
  const i=idxAt(s), j=idxAt(s+(back?-25:25)); const [tx,ty]=tang(i);
  const off = back ? R.wl[i]/2 : -R.wr[i]/2;  // right-hand lane in travel direction
  const p=edgePt(i, off), q=edgePt(j, off);
  cam.position.copy(W(p[0],p[1],p[2]+1.15)); cam.lookAt(W(q[0],q[1],q[2]+0.6)); }
function info(s){ const i=idxAt(s); document.getElementById('info').textContent =
  `s = ${s.toFixed(0)} m · z = ${R.z[i].toFixed(1)} m · width ${(R.wl[i]+R.wr[i]).toFixed(1)} m · grade ${(R.g[i]*100).toFixed(1)}%`; }
function setView(s, m){ cur=s; mode=m||mode; sl.value=s; controls.enabled = mode==='orbit';
  document.getElementById('bOrbit').classList.toggle('on',mode==='orbit'); document.getElementById('bDrive').classList.toggle('on',mode==='drive');
  if (mode==='orbit') placeOrbit(s); else driver(s); info(s); if (STATIC) renderer.render(scene,cam); }
window.setView=setView; window.dbg=()=>({cam:cam.position.toArray(), tgt:controls.target.toArray(), n:scene.children.length, kids:scene.children.map(c=>c.type+':'+(c.name||'')+':'+(c.geometry?c.geometry.attributes.position.count:0)).slice(0,30)});
sl.oninput=()=>setView(+sl.value);
document.getElementById('bOrbit').onclick=()=>setView(cur,'orbit');
document.getElementById('bDrive').onclick=()=>setView(cur,'drive');
document.getElementById('bPlay').onclick=e=>{ playing=!playing; e.target.classList.toggle('on',playing); if(playing) setView(cur,'drive'); };
let cm=0; document.getElementById('bColor').onclick=e=>{ cm=(cm+1)%3; buildRoad(cm); e.target.textContent='Road: '+['plain','grade','width'][cm]; };
const P=new URLSearchParams(location.search); const STATIC=P.has('static');
if (P.has('noui')) document.body.classList.add('hide-ui');
if (P.has('clean')) { OV.visible=false; document.getElementById('bOv').classList.remove('on'); }
document.getElementById('bOv').onclick=e=>{ OV.visible=!OV.visible; e.target.classList.toggle('on',OV.visible); };
setView(+(P.get('s')||0), P.get('mode')||'orbit');
if (P.has('top')){ const i=idxAt(cur); const p=W(R.x[i],R.y[i],R.z[i]); controls.target.copy(p); cam.position.copy(p).add(new THREE.Vector3(0,+P.get('top')||150,0.01)); controls.update(); }
addEventListener('resize',()=>{ cam.aspect=innerWidth/innerHeight; cam.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
let last=performance.now();
if (STATIC){ THREE.DefaultLoadingManager.onLoad=()=>{ renderer.render(scene,cam); window.__ready=true; }; }
else renderer.setAnimationLoop(t=>{ const dt=(t-last)/1000; last=t;
  if (playing){ cur=Math.min(META.length-30, cur+dt*20); sl.value=cur; driver(cur); info(cur); }
  if (mode==='orbit') controls.update(); renderer.render(scene,cam); window.__ready=true; });
</script>
</body>
</html>
