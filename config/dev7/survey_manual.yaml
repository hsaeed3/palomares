# dev7 package M: by-eye survey rows (Mapillary thumb_1024 images judged visually, 2026-11-07).
# One row per singular asset or linear run. Fields: road, s, s1 (linear end or null), side (L/R relative to increasing
# station on that road), off (m beyond the pavement edge), asset (config/asset_catalog.yaml), params, conf, note.
# dir: nb = faces traffic travelling with increasing s, sb = against (same meaning as the Palomares ledger).
# Positions are +-10 m along the road (75 m sample + dense landmark frames), off is estimated by eye.
# scripts/p7/11_mapillary_ledger.py turns this into data/scene/ledger_parts/dev7_mapillary.jsonl.
