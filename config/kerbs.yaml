# Race kerbs + painted run-off for the track_* layouts (scripts/p2/kerbs.py, called from 21_build_geometry.py).
# dev4: kerbs are placed FROM THE RACING LINE (scripts/p2/racing_line.py, config/racing_line.yaml), per run
# direction -> palomares_kerbs_nb.kn5 / _sb.kn5. The curvature keys below are still used by 21b (marshal posts,
# barrier ranking); apex_entry_m / inside_exit_m / outside_exit_* are legacy (curvature placement, unused).
placement:
  touch_m: 0.60                    # kerb only where the line's tyre comes within this of that asphalt edge
  apex_min_k_1pm: 0.004            # apex = inside touch while the line curves toward that edge (R < 250 m)
  min_touch_m: 3                   # ignore shorter touches
  exit_lookback_m: 90              # outside touch within this distance after an apex on the other side = exit
  pad_m: 3                         # extend kerbs this far past the touch zone at both ends (covers the taper)
  apex_forbid_env: [steep_drop]                # never an apex kerb above a steep drop
  exit_forbid_env: [drop_off, steep_drop]      # no exit kerb where running wide means going over the edge
  driveway_clear_m: 8              # no kerb within this of a driveway mouth (features.geojson) ...
  junction_clear_m: 15             # ... or a junction
  apron_clear_m: 3                 # ... or a surveyed driveway apron span (edge_profile._aprons)
  side_offset_m: 1.0               # |offset_m| below this -> feature blocks both sides
  runoff_gap_m: 0.45               # painted run-off only where the line runs out to <= this from the edge
sigma_m: 6.0
curvature_threshold_1pm: 0.0167    # R < 60 m counts as a corner
min_corner_length_m: 10            # ignore shorter curvature blips
apex_entry_m: 6                    # apex kerb starts this far before the curvature peak (run direction)
inside_exit_m: 14                  # ... and ends this far after it
outside_exit_start_m: 4            # exit kerb (outside) starts this far after the peak
outside_exit_length_m: 20          # ... and runs this long
merge_gap_m: 6                     # merge kerbs of the same type on the same side closer than this
min_kerb_length_m: 6               # drop shorter pieces
taper_m: 3.0                       # smoothstep taper of height AND width at both ends
max_shoulder_kink_m: 0.02         # no kerb over a shoulder ditch/hump deeper than this (mid vs chord)
max_shoulder_grade: 0.15          # no kerb where the shoulder cross-slope differs from the road plane by more than this
max_shoulder_drop_m: 0.025         # raised profile fades out where the shoulder falls > this below the road plane
max_lip_slope: 0.08                # kerb height <= this x local kerb width (narrow shoulders => lower kerb)
taper_min_width_frac: 0.5          # width at the very ends (fraction of full width)
lift_m: 0.004                      # base lift above the road-plane/shoulder (no z-fighting); inner edge stays at 0
max_above_shoulder_m: 0.012        # base continues the road plane, but at most this far above a falling shoulder
skip_s_ranges: [[0, 30]]           # start area (SR-84 junction)

# Profiles: profile_t = fraction of the width from the road edge (0) outward (1); profile_h = fraction of height_m.
# Inner column is the road-edge vertex itself (h must be 0 there); outer column sinks 2 mm into the shoulder.
# u0/u1 = horizontal range in the kerb texture atlas (left half apex, right half exit). Width <= 0.8 m (shoulder).
types:
  apex:                            # narrow, rounded, ridged rumble strip (normal-mapped transverse ridges)
    width_m: 0.60
    height_m: 0.025
    stripe_length_m: 1.2           # red / white block length
    # dev6 FFB safety: wider, gentler lips (dev5's 0.06 lip became a 40-60 deg micro-step at the tapers)
    profile_t: [0.0, 0.15, 0.30, 0.42, 0.5, 0.58, 0.70, 0.85, 1.0]
    profile_h: [0.0, 0.25, 0.70, 0.95, 1.0, 0.95, 0.70, 0.25, 0.0]
    u0: 0.01
    u1: 0.49
  exit:                            # wide, flat-topped, low exit kerb
    width_m: 0.80
    height_m: 0.015
    stripe_length_m: 1.5
    profile_t: [0.0, 0.15, 0.30, 0.5, 0.70, 0.85, 1.0]
    profile_h: [0.0, 0.45, 0.92, 1.0, 0.92, 0.45, 0.0]
    u0: 0.51
    u1: 0.99

# Painted run-off strip (green, physics 1RUNOFF_*, surfaces.ini key RUNOFF) outside exit kerbs, on the terrain
# beyond the shoulder. Only where the verge type allows it and no guardrail; draped on the built terrain mesh.
runoff:
  enabled: true
  width_m: 2.0
  columns: 6
  allowed_env: [flat]              # centerline.csv env_left/env_right values (skip drop_off, cut_bank, walls, ditch)
  min_length_m: 8
  taper_m: 3.0
  lift_inner_m: 0.004              # at the shoulder/terrain seam (meets the exit kerb outer edge)
  lift_m: 0.025                    # over the terrain mesh
  max_step_across_m: 0.20          # reject rows rougher than this between columns
  max_rise_m: 0.35                 # ... or rising/falling more than this across the strip
  tex_m: 2.0                       # texture repeat

# dev7 K: kerb paint styles. A texture cycle holds one block of each colour (kerbs.py: v = s / (n_blocks * stripe)).
# Block lengths per type stay types.<type>.stripe_length_m. Profiles / heights are unchanged (FFB-safe dev6 values).
style_use: palomares               # style of the Palomares track_* kerbs (kerb_d.png, 22_build_kn5.py)
style:
  palomares:                       # "Palomares GP": Spa-Francorchamps-style red / yellow / green blocks
    blocks: [[198, 30, 34], [242, 196, 22], [28, 128, 62]]
  niles_canyon:                    # Red-Bull-Ring-style red / white, green-painted run-off, yellow sausage kerbs
    blocks: [[198, 30, 34], [236, 234, 228]]
    runoff_rgb: [42, 140, 70]

# dev7 K: Niles Canyon Rd track layouts (scripts/p7k/canyon_kerbs.py). Racing-line placement as above
# (placement.*, overridden here), but NOTHING inside road.outer (asphalt + paved shoulder): every piece starts
# clear_m beyond it, checked per vertex against every dev7 road by the lint (exit 1 on a hit).
niles_canyon:
  clear_m: 0.05                    # gap between road.outer and the kerb's inner edge
  lint_tol_m: 0.02
  min_kerb_length_m: 8
  taper_m: 3.0                     # smoothstep height taper at both ends of every piece
  skip_s_ranges: [[0, 60], [10650, 10730]]     # Mission Blvd start area, Sunol stop
  placement: {touch_m: 1.2, apex_min_k_1pm: 0.004, exit_lookback_m: 140, min_touch_m: 4}
  clear_kinds: {junction: 15, level_crossing: 20, rail_underpass: 10, bridge_osm: 5, bridge_lidar_class17: 5,
                stream_crossing_bridge: 5, steep_drop: 3, guardrail_candidate: 2, wall_or_steep_cut: 2, crossing: 10}
  types:
    apex: {width_m: 0.8, height_m: 0.03, stripe_length_m: 1.0, profile_t: [0, 0.2, 0.5, 0.8, 1], profile_h: [0, 0.7, 1, 0.7, 0]}
    exit: {width_m: 1.0, height_m: 0.015, stripe_length_m: 1.0, profile_t: [0, 0.2, 0.5, 0.8, 1], profile_h: [0, 0.8, 1, 0.8, 0]}
  runoff:                          # green-painted run-off outside exit kerbs
    width_m: 3.0
    pre_m: 0
    post_m: 25
    min_length_m: 12
    allowed_env: [flat, ditch]
    max_rise_m: 0.4                # DTM within this of the road edge level across the strip
    lift_m: 0.02
    tex_m: 2.0
  sausage:                         # yellow sausage kerb at the outer end of the run-off (extended track limit)
    width_m: 0.6
    height_m: 0.06                 # low half-cosine bump: max slope ~17 deg, creases well under 25 deg
    gap_m: 0.0
    from_frac: 0.15                # covers the middle of the run-off (lengthwise)
    to_frac: 0.85
    min_length_m: 6
